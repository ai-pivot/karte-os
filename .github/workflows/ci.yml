name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  RISC-V Build
  # ═══════════════════════════════════════════════════════════════
  build-riscv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup component add clippy rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: riscv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: riscv-cargo-

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Build kernel
        run: cargo build --release -p karte-os-kernel --target riscv64gc-unknown-none-elf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: |
          cargo clippy --release -p karte-os-kernel --target riscv64gc-unknown-none-elf -- \
            -A deprecated -A clippy::redundant_field_names -A clippy::result_unit_err \
            -A clippy::default_trait_access -A clippy::manual_range_contains \
            -A clippy::is_multiple_of -A clippy::div_ceil -A clippy::redundant-casting \
            -A clippy::needless_range_loop -A clippy::borrow_interior_mutable_const \
            -A clippy::absurd_extreme_comparisons -A clippy::bad_bit_mask

      - name: Upload RISC-V kernel
        uses: actions/upload-artifact@v4
        with:
          name: kernel-riscv
          path: target/riscv64gc-unknown-none-elf/release/karte-os-kernel

  # ═══════════════════════════════════════════════════════════════
  #  x86_64 Build
  # ═══════════════════════════════════════════════════════════════
  build-x86:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          rustup toolchain install nightly
          rustup component add rust-src --toolchain nightly

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: x86-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: x86-cargo-

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 grub-common xorriso mtools

      - name: Build user programs (x86_64)
        run: cd user && make ARCH=x86_64 clean && make ARCH=x86_64

      - name: Build kernel + ISO
        run: |
          touch user/hello.elf user/heap_test.elf user/file_test.elf user/spawn_test.elf
          cargo +nightly build --release --target x86_64-unknown-none -p karte-os-kernel -Z build-std=core,alloc
          mkdir -p target/x86_64-iso/boot/grub
          cp target/x86_64-unknown-none/release/karte-os-kernel target/x86_64-iso/boot/karte-os-kernel
          printf 'set timeout=0\nset default=0\nmenuentry "KarteOS" {\n    multiboot2 /boot/karte-os-kernel\n    boot\n}\n' > target/x86_64-iso/boot/grub/grub.cfg
          grub-mkrescue -o target/karte-os-x86_64.iso target/x86_64-iso

      - name: Upload x86_64 ISO
        uses: actions/upload-artifact@v4
        with:
          name: karte-os-x86_64
          path: target/karte-os-x86_64.iso

  # ═══════════════════════════════════════════════════════════════
  #  RISC-V Tests
  # ═══════════════════════════════════════════════════════════════
  test:
    runs-on: ubuntu-latest
    needs: build-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: riscv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: riscv-cargo-

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Run integration tests
        run: |
          cargo build --release -p karte-os-kernel --features test_mode --target riscv64gc-unknown-none-elf
          bash scripts/run-tests.sh

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/qemu-test-output.log

  # ═══════════════════════════════════════════════════════════════
  #  Boot Tests
  # ═══════════════════════════════════════════════════════════════
  boot-test-riscv:
    runs-on: ubuntu-latest
    needs: build-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: riscv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: riscv-cargo-

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build and boot
        run: |
          cd user && make clean && make && cd ..
          dd if=/dev/zero of=disk.img bs=1M count=1 2>/dev/null
          make build
          timeout 10 qemu-system-riscv64 \
            -machine virt -cpu rv64 -nographic -bios default -m 128M -smp 1 \
            -kernel target/riscv64gc-unknown-none-elf/release/karte-os-kernel \
            > /tmp/boot.log 2>&1 || true
          if grep -qa "KarteOS Shell" /tmp/boot.log; then
            echo "✅ Boot test PASSED"
          else
            echo "❌ Boot test FAILED"
            cat /tmp/boot.log
            exit 1
          fi

  boot-test-x86:
    runs-on: ubuntu-latest
    needs: build-x86
    steps:
      - uses: actions/checkout@v4

      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: karte-os-x86_64
          path: ./

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      - name: Boot test x86_64
        run: |
          dd if=/dev/zero of=disk.img bs=1M count=1 2>/dev/null
          timeout 10 qemu-system-x86_64 \
            -machine pc -cpu qemu64 -nographic -m 128M \
            -cdrom karte-os-x86_64.iso -no-reboot \
            > /tmp/boot-x86.log 2>&1 || true
          if grep -qa "KarteOS Shell" /tmp/boot-x86.log; then
            echo "✅ x86_64 boot test PASSED"
          else
            echo "❌ x86_64 boot test FAILED"
            cat /tmp/boot-x86.log
            exit 1
          fi

  smp-test:
    runs-on: ubuntu-latest
    needs: build-riscv
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: riscv-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: riscv-cargo-

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: SMP boot test
        run: |
          cd user && make clean && make && cd ..
          dd if=/dev/zero of=disk.img bs=1M count=1 2>/dev/null
          make build
          timeout 15 qemu-system-riscv64 \
            -machine virt -cpu rv64 -nographic -bios default -m 128M -smp 4 \
            -kernel target/riscv64gc-unknown-none-elf/release/karte-os-kernel \
            > /tmp/smp.log 2>&1 || true
          if grep -qa "KarteOS Shell" /tmp/smp.log; then
            echo "✅ SMP test PASSED"
          else
            echo "❌ SMP test FAILED"
            cat /tmp/smp.log
            exit 1
          fi

  # ═══════════════════════════════════════════════════════════════
  #  Publish release artifacts (main push only)
  # ═══════════════════════════════════════════════════════════════
  disk-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [build-riscv, build-x86]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu dosfstools mtools

      - name: Create disk image with user programs
        run: |
          # Build user programs
          cd user && make clean && make && cd ..
          # Create and populate disk image
          tools/mkdisk.sh init
          for f in user/*.elf; do
            name=$(basename "$f" .elf)
            case "$name" in hello|heap_test|file_test|spawn_test) continue;; esac
            tools/mkdisk.sh put "$f" 2>/dev/null || true
          done

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Collect artifacts with short names
          cp artifacts/kernel-riscv/karte-os-kernel karte-os-riscv64-kernel
          cp artifacts/karte-os-x86_64/karte-os-x86_64.iso karte-os-x86_64.iso

          TAG="latest"
          TITLE="Latest Build"

          # Delete existing release+tag if present, then create fresh
          gh release delete "$TAG" --yes 2>/dev/null || true
          git push origin :refs/tags/"$TAG" 2>/dev/null || true

          COMMIT=$(git rev-parse --short HEAD)
          gh release create "$TAG" \
            karte-os-riscv64-kernel \
            karte-os-x86_64.iso \
            disk.img \
            --title "$TITLE" \
            --notes "Automated build from main ($COMMIT)" \
            --target main
