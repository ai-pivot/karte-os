name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Job 1: Build ──
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install QEMU and cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Build (release)
        run: make build

      - name: Upload kernel binary
        uses: actions/upload-artifact@v4
        with:
          name: kernel-binary
          path: target/riscv64gc-unknown-none-elf/release/karte-os-kernel

  # ── Job 2: Lint ──
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup target add riscv64gc-unknown-none-elf
          rustup component add clippy rustfmt

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --release -p karte-os-kernel --target riscv64gc-unknown-none-elf -- -A deprecated -A clippy::redundant_field_names -A clippy::result_unit_err -A clippy::default_trait_access -A clippy::manual_range_contains -A clippy::is_multiple_of -A clippy::div_ceil -A clippy::redundant-casting -A clippy::needless_range_loop -A clippy::borrow_interior_mutable_const

  # ── Job 3: QEMU Integration Tests ──
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Build test kernel
        run: cargo build --release -p karte-os-kernel --features test_mode --target riscv64gc-unknown-none-elf

      - name: Run QEMU tests
        run: bash scripts/run-tests.sh

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/qemu-test-output.log

  # ── Job 4: QEMU Boot Test (normal mode) ──
  boot-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Create disk image
        run: dd if=/dev/zero of=disk.img bs=1M count=1

      - name: Build kernel
        run: make build

      - name: Boot test
        run: |
          timeout 10 qemu-system-riscv64 \
            -machine virt -cpu rv64 -nographic \
            -bios default -m 128M -smp 1 \
            -kernel target/riscv64gc-unknown-none-elf/release/karte-os-kernel \
            > /tmp/boot-output.log 2>&1 || true
          
          echo "=== Boot Output ==="
          grep -a 'KarteOS\|init\|user\|Hello\|virtio\|process\|Loading\|exited\|Entering\|page_table\|kstack\|ustack' /tmp/boot-output.log | head -50 || true
          
          if grep -qa "Hello from user" /tmp/boot-output.log; then
            echo "Boot test PASSED"
          else
            echo "Boot test FAILED"
            echo "=== First 80 lines of raw output ==="
            grep -a '.' /tmp/boot-output.log | head -80 || true
            echo "=== QEMU interrupt log (last 20 exceptions) ==="
            grep -a 'riscv_cpu_do_interrupt' /tmp/boot-output.log | tail -20 || true
            exit 1
          fi

  # ── Job 5: SMP Boot Test ──
  smp-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup target add riscv64gc-unknown-none-elf

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-misc gcc-riscv64-linux-gnu

      - name: Build user programs
        run: cd user && make clean && make

      - name: Create disk image
        run: dd if=/dev/zero of=disk.img bs=1M count=1

      - name: Build kernel
        run: make build

      - name: SMP boot test
        run: |
          timeout 10 qemu-system-riscv64 \
            -machine virt -cpu rv64 -nographic \
            -bios default -m 128M -smp 4 \
            -kernel target/riscv64gc-unknown-none-elf/release/karte-os-kernel \
            > /tmp/smp-output.log 2>&1 || true
          
          echo "=== SMP Output ==="
          grep -a 'KarteOS\|smp\|hart\|user\|Hello\|virtio' /tmp/smp-output.log | head -20 || true
          
          if grep -qa "Hello from user" /tmp/smp-output.log; then
            echo "SMP boot test PASSED"
          else
            echo "SMP boot test FAILED"
            grep -a '.' /tmp/smp-output.log | head -50 || true
            echo "=== QEMU interrupt log ==="
            grep -a 'riscv_cpu_do_interrupt' /tmp/smp-output.log | tail -20 || true
            exit 1
          fi
