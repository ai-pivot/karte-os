[package]
name = "karte-os-kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
test_mode = []
klog_trace = []
klog_debug = []
# XHCI device-enumeration breaker. When enabled, the kernel runs the full
# USB/HID enumeration path at boot. Keep OFF for real-hardware boots until
# each stage is verified in QEMU; ON is the QEMU smoke-test default.
xhci_enum = []

[dependencies]
linked_list_allocator = "0.10"
buddy_system_allocator = "0.11"
spin = "0.12"
bitflags = "2.11"
starry-fatfs = { version = "0.4.1-preview.2", default-features = false, features = ["alloc", "lfn"] }
log = { version = "0.4", default-features = false }
ext4_rs = { path = "vendor/ext4_rs" }
smoltcp = { version = "0.12", default-features = false, features = [
    "alloc",
    "proto-ipv4",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
    "socket-dns",
    "medium-ethernet",
] }

# RISC-V 64-bit specific dependencies
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.16"
riscv-rt = "0.17"
sbi = "0.3"

# virtio-drivers: RISC-V uses MMIO transport, x86_64 uses PCI→MMIO via BAR
[dependencies.virtio-drivers]
version = "0.13.0"
features = ["alloc"]

# x86_64 specific dependencies
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"
uart_16550 = "0.3"
raw-cpuid = "11.0"
