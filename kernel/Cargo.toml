[package]
name = "karte-os-kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
test_mode = []

[dependencies]
riscv = "0.12"
riscv-rt = "0.13"
sbi-rt = { version = "0.0.4", features = ["legacy"] }
buddy_system_allocator = "0.11"
spin = "0.9"
bitflags = "2.0"
virtio-drivers = { version = "0.13.0", features = ["alloc"] }
