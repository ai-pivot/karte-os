[package]
name = "karte-os-kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
test_mode = []

# RISC-V 特定依赖
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.16"
riscv-rt = "0.17"
sbi = "0.3"

# x86_64 特定依赖
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"
uart_16550 = "0.3"
raw-cpuid = "11.0"

# 架构无关依赖
[dependencies]
buddy_system_allocator = "0.13"
spin = "0.12"
bitflags = "2.11"
starry-fatfs = { version = "0.4.1-preview.2", default-features = false, features = ["alloc", "lfn"] }
log = { version = "0.4", default-features = false }
ext4_rs = { path = "vendor/ext4_rs" }

# virtio-drivers 仅 RISC-V 需要 (MMIO transport)
[target.'cfg(target_arch = "riscv64")'.dependencies.virtio-drivers]
version = "0.13.0"
features = ["alloc"]
