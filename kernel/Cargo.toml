[package]
name = "karte-os-kernel"
version = "0.1.0"
edition = "2024"

[features]
default = []
test_mode = []

[dependencies]
buddy_system_allocator = "0.13"
spin = "0.12"
bitflags = "2.11"
starry-fatfs = { version = "0.4.1-preview.2", default-features = false, features = ["alloc", "lfn"] }
log = { version = "0.4", default-features = false }
ext4_rs = { path = "vendor/ext4_rs" }

# RISC-V 64-bit specific dependencies
[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.16"
riscv-rt = "0.17"
sbi = "0.3"

# virtio-drivers: RISC-V uses MMIO transport, x86_64 uses PCI→MMIO via BAR
[dependencies.virtio-drivers]
version = "0.13.0"
features = ["alloc"]

# x86_64 specific dependencies
[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = "0.15"
uart_16550 = "0.3"
raw-cpuid = "11.0"
